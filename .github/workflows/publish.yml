# Publishes this n8n community node package to npm on every version tag push.
# n8n verification requires GitHub Actions plus an npm provenance statement.
# Auth is npm Trusted Publishing (GitHub OIDC). Do not set NPM_TOKEN:
# a normal npm token makes publish demand a one-time password.

name: Publish

on:
  push:
    tags:
      - '*.*.*'

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
          registry-url: 'https://registry.npmjs.org'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Release
        run: npm run release
